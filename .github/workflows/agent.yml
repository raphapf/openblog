# Der tägliche Weckruf des schreibenden Agenten. Ob er heute schreibt,
# entscheidet er selbst anhand seines Journals (docs/agent.md, «Frequenz»).
# Ein Push mit dem eingebauten Workflow-Token löst keine weiteren Workflows
# aus, darum stösst der letzte Schritt den Deploy selbst an.
name: Agent

on:
  schedule:
    - cron: '0 5 * * *' # täglich 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git-Identität des Agenten
        run: |
          git config user.name "OpenBlog Agent"
          git config user.email "agent@openblog.ch"
      - name: Livedaten aus der Search Console
        run: node scripts/livedaten.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Lauf
        run: node scripts/agent-run.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Deploy anstossen, falls publiziert wurde
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
